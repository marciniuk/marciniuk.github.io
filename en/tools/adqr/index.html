<!doctype html>
<html lang="en" class="overflow-x-clip scroll-smooth">
  <head>
    <!-- Main -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Adrian Marcini.uk</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="A website created under the influence of caffeine and far too much free time."
    />
    <meta name="author" content="Adrian Marciniuk" />
    <meta name="robots" content="index, follow" />

    <!-- Assets -->
    <link rel="preload" href="/assets/css/main.css" as="style" />
    <link href="/assets/css/main.css" rel="stylesheet" />

    <link rel="preload" href="/assets/js/stars.js" as="script" />
    <script src="/assets/js/stars.js" defer></script>

    <link rel="preload" href="/assets/js/main.js" as="script" />

    <link
      rel="stylesheet"
      href="/assets/css/fonts.css"
      media="print"
      onload="this.media = 'all'"
    />

    <script async src="/assets/fajs/fontawesome.js"></script>
    <script async src="/assets/fajs/fa-cut.js"></script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Marcini.uk" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />

    <!-- Canonical -->
    <link rel="canonical" href="https://marcini.uk/en/tools/adqr/" />

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Adrian Marciniuk",
        "url": "https://marcini.uk/",
        "image": "https://marcini.uk/assets/img/og/og-image.jpg",
        "sameAs": ["https://github.com/marciniuk"],
        "jobTitle": "Frontend Developer",
        "worksFor": { "@type": "Organization", "name": "Marcini.uk" }
      }
    </script>

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marcini.uk/en/tools/adqr/" />
    <meta property="og:title" content="Adrian Marcini.uk" />
    <meta
      property="og:description"
      content="A website created under the influence of caffeine and far too much free time."
    />
    <meta
      property="og:image"
      content="https://marcini.uk/assets/img/og/og-image.jpg"
    />
    <meta property="og:site_name" content="Marcini.uk" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@adrianmarciniuk" />
    <meta name="twitter:creator" content="@adrianmarciniuk" />
    <meta name="twitter:title" content="Adrian Marcini.uk" />
    <meta
      name="twitter:description"
      content="A website created under the influence of caffeine and far too much free time."
    />
    <meta
      name="twitter:image"
      content="https://marcini.uk/assets/img/og/og-image.jpg"
    />

    <!-- Fade-in -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          document.body.classList.add("page-ready");
        }, 150);
      });
    </script>
  </head>

  <body>
    <!-- STARS -->
    <stars></stars>

    <!-- OVERLAY -->
    <div
      id="overlay"
      class="fixed inset-0 pointer-events-none transition-opacity duration-300 z-30"
    >
      <div
        class="h-20 w-full bg-linear-to-b from-blue-900 via-blue-900/25 xl:via-blue-900/75 to-blue-900/0 absolute top-0 z-20"
      ></div>
    </div>

    <!-- HEADER -->
    <header
      id="main-header"
      class="xl:mb-4 h-11 lg:h-14 p-2 mr-0 bg-blue-700/60 border-b xl:border border-blue-600 backdrop-blur-md backdrop-brightness-75 flex items-center sticky z-40 transition-all duration-500 ease-in-out"
    >
      <div class="flex justify-between w-full items-center z-30">
        <!-- LOGO -->
        <a
          href="/en/"
          class="flex gap-2 text-3xl lg:text-4xl italic items-center"
        >
          <img src="/assets/img/logo.svg" alt="logo" class="h-8 lg:h-10" />
          Marcini.uk
        </a>

        <!-- HAMBURGER -->
        <button
          type="button"
          id="menu-toggle"
          class="z-50 xl:hidden h-6 w-8 flex flex-col justify-between cursor-pointer"
          aria-label="Open menu"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          <span class="w-full h-1 bg-white rounded-full transition-all"></span>
          <span class="w-full h-1 bg-white rounded-full transition-all"></span>
          <span class="w-full h-1 bg-white rounded-full transition-all"></span>
        </button>

        <!-- MENU -->
        <nav
          id="mobile-menu"
          class="fixed xl:static top-[2.7rem] right-0 bottom-0 w-48 md:w-56 xl:w-auto bg-blue-600 xl:bg-transparent flex flex-col xl:flex-row items-start xl:items-center gap-4 xl:gap-8 p-8 xl:p-0 text-xl md:text-2xl transform translate-x-full xl:translate-x-0 transition-transform duration-500 ease-in-out overflow-hidden z-10 xl:px-5"
        >
          <a href="/en/profiles/" class="nav-link hover:text-rose-400"
            ><i class="fad fa-address-card"></i> Profiles</a
          >
          <a href="/en/projects/" class="nav-link hover:text-emerald-400"
            ><i class="fad fa-diagram-project"></i> Projects</a
          >
          <a href="/en/setup/" class="nav-link hover:text-amber-400"
            ><i class="fad fa-display-code"></i> Setup</a
          >
          <a href="/en/contact/" class="nav-link hover:text-sky-400"
            ><i class="fad fa-envelope-open-text"></i> Contact</a
          >
        </nav>
      </div>

      <!-- VH FIX -->
      <script>
        (function () {
          function setVh() {
            document.documentElement.style.setProperty(
              "--vh",
              `${window.innerHeight * 0.01}px`,
            );
          }
          setVh();
          window.addEventListener("resize", setVh);
        })();
      </script>
    </header>

    <!-- MAIN -->
    <main class="w-full h-full flex place-content-center items-center">
      <section
        class="m-4 flex h-full w-auto flex-col gap-5 rounded-3xl border border-white/15 bg-blue-700/40 p-5 shadow-2xl shadow-blue-950/40 backdrop-blur-xl md:flex-row md:p-6"
      >
        <!-- CONTROLS -->
        <div
          class="flex h-auto w-full flex-col justify-evenly gap-4 md:min-w-88"
        >
          <!-- INPUT -->
          <h1 class="text-3xl font-bold tracking-tight text-white">
            QR Generator
          </h1>

          <input
            id="qr-text"
            class="w-full rounded-2xl border border-white/15 bg-blue-950/30 px-4 py-2.5 text-sky-100 shadow-inner shadow-white/3 outline-none backdrop-blur-md transition-all duration-300 placeholder:text-sky-200/40 hover:border-white/25 hover:bg-blue-950/40 focus:border-sky-300/60 focus:bg-blue-950/50 focus:ring-2 focus:ring-sky-300/10"
            placeholder="https://marcini.uk"
            value="https://marcini.uk"
          />

          <!-- COLORS -->
          <div class="flex w-full flex-col gap-2">
            <label class="text-xl font-bold text-white">Colors</label>

            <div class="flex w-full gap-3 text-sky-100">
              <!-- FG -->
              <div class="flex w-1/2 flex-col gap-1.5">
                <span class="text-sm font-semibold text-sky-100/80">
                  Module color (FG)
                </span>

                <input
                  id="fgPicker"
                  type="color"
                  class="h-10 w-full cursor-pointer rounded-2xl border border-white/15 bg-white/6 p-1 shadow-inner shadow-white/4 backdrop-blur-md transition-all duration-300 hover:border-sky-300/50 hover:bg-white/10"
                  onchange="setFG(this.value)"
                />
              </div>

              <!-- BG -->
              <div class="flex w-1/2 flex-col gap-1.5">
                <span class="text-sm font-semibold text-sky-100/80">
                  Background color (BG)
                </span>

                <div class="flex w-full gap-2">
                  <button
                    class="group relative w-1/2 overflow-hidden rounded-2xl border border-white/15 bg-white/6 px-3 py-2 text-sm font-semibold text-sky-100 shadow-lg shadow-blue-950/20 backdrop-blur-md transition-all duration-300 hover:-translate-y-0.5 hover:border-white/30 hover:bg-white/10 hover:shadow-xl hover:shadow-blue-950/30 active:translate-y-0 active:scale-95"
                    onclick="setBG('transparent')"
                  >
                    <span class="relative z-10">None</span>
                    <span
                      class="absolute inset-0 z-0 bg-linear-to-b from-white/8 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                    ></span>
                  </button>

                  <input
                    id="bgPicker"
                    type="color"
                    class="h-10 w-1/2 cursor-pointer rounded-2xl border border-white/15 bg-white/6 p-1 shadow-inner shadow-white/4 backdrop-blur-md transition-all duration-300 hover:border-sky-300/50 hover:bg-white/10"
                    onchange="setBG(this.value)"
                  />
                </div>
              </div>
            </div>

            <input id="qr-fg" type="hidden" value="#ffffff" />
            <input id="qr-bg" type="hidden" value="transparent" />
          </div>

          <!-- ROUNDNESS -->
          <div class="flex flex-col gap-2">
            <label class="text-xl font-bold text-white">
              Module roundness
            </label>

            <div class="flex items-center justify-between gap-4 text-sky-100">
              <button
                class="group relative overflow-hidden rounded-2xl border border-sky-300/20 bg-sky-300/10 px-4 py-2 font-bold text-sky-100 shadow-lg shadow-blue-950/20 backdrop-blur-md transition-all duration-300 hover:-translate-y-0.5 hover:border-sky-200/50 hover:bg-sky-300/20 hover:shadow-xl hover:shadow-sky-950/30 active:translate-y-0 active:scale-95"
                onclick="changeRadius(-10)"
              >
                <span class="relative z-10">−10%</span>
                <span
                  class="absolute inset-0 z-0 bg-linear-to-b from-white/10 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                ></span>
              </button>

              <div
                id="roundnessDisplay"
                class="min-w-20 text-center text-2xl font-bold tabular-nums text-white drop-shadow-md"
              >
                100%
              </div>

              <button
                class="group relative overflow-hidden rounded-2xl border border-sky-300/20 bg-sky-300/10 px-4 py-2 font-bold text-sky-100 shadow-lg shadow-blue-950/20 backdrop-blur-md transition-all duration-300 hover:-translate-y-0.5 hover:border-sky-200/50 hover:bg-sky-300/20 hover:shadow-xl hover:shadow-sky-950/30 active:translate-y-0 active:scale-95"
                onclick="changeRadius(10)"
              >
                <span class="relative z-10">+10%</span>
                <span
                  class="absolute inset-0 z-0 bg-linear-to-b from-white/10 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                ></span>
              </button>
            </div>

            <input id="qr-roundness" type="hidden" value="100" />
          </div>

          <!-- PADDING -->
          <div class="mt-2 flex flex-col gap-2">
            <label class="text-xl font-bold text-white">
              Spacing between modules
            </label>

            <div
              class="relative mb-1 w-full text-sky-100"
              data-dropdown="merge"
            >
              <!-- MAIN BUTTON -->
              <button
                class="dropdown-btn flex w-full items-center justify-between rounded-2xl border border-white/15 bg-white/6 px-4 py-2.5 shadow-xl shadow-blue-950/20 backdrop-blur-xl transition-all duration-300 hover:border-white/30 hover:bg-white/10 hover:shadow-blue-950/30"
              >
                <span class="dropdown-label font-medium">No merging</span>

                <svg
                  class="dropdown-icon h-5 w-5 text-sky-200 transition-transform duration-300"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M6 9l6 6 6-6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>

              <!-- LIST -->
              <ul
                class="dropdown-list absolute z-50 mt-2 w-full overflow-hidden rounded-2xl border border-white/15 bg-[#0e1e39]/90 shadow-2xl shadow-black/40 backdrop-blur-xl opacity-0 pointer-events-none transition duration-200"
              >
                <li
                  class="dropdown-item cursor-pointer px-4 py-2.5 text-blue-100 transition-all duration-200 hover:bg-white/8 hover:pl-5 hover:text-white"
                  data-value="none"
                >
                  No merging
                </li>

                <li
                  class="dropdown-item cursor-pointer px-4 py-2.5 text-blue-100 transition-all duration-200 hover:bg-white/8 hover:pl-5 hover:text-white"
                  data-value="horizontal"
                >
                  Horizontal merging
                </li>

                <li
                  class="dropdown-item cursor-pointer px-4 py-2.5 text-blue-100 transition-all duration-200 hover:bg-white/8 hover:pl-5 hover:text-white"
                  data-value="vertical"
                >
                  Vertical merging
                </li>

                <li
                  class="dropdown-item cursor-pointer px-4 py-2.5 text-blue-100 transition-all duration-200 hover:bg-white/8 hover:pl-5 hover:text-white"
                  data-value="full"
                >
                  Full merging
                </li>
              </ul>
            </div>

            <div class="flex items-center justify-between gap-4 text-sky-100">
              <button
                class="group relative overflow-hidden rounded-2xl border border-sky-300/20 bg-sky-300/10 px-4 py-2 font-bold text-sky-100 shadow-lg shadow-blue-950/20 backdrop-blur-md transition-all duration-300 hover:-translate-y-0.5 hover:border-sky-200/50 hover:bg-sky-300/20 hover:shadow-xl hover:shadow-sky-950/30 active:translate-y-0 active:scale-95"
                onclick="changePadding(-1)"
              >
                <span class="relative z-10">−1</span>
                <span
                  class="absolute inset-0 z-0 bg-linear-to-b from-white/10 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                ></span>
              </button>

              <div
                id="paddingDisplay"
                class="min-w-20 text-center text-2xl font-bold tabular-nums text-white drop-shadow-md"
              >
                1
              </div>

              <button
                class="group relative overflow-hidden rounded-2xl border border-sky-300/20 bg-sky-300/10 px-4 py-2 font-bold text-sky-100 shadow-lg shadow-blue-950/20 backdrop-blur-md transition-all duration-300 hover:-translate-y-0.5 hover:border-sky-200/50 hover:bg-sky-300/20 hover:shadow-xl hover:shadow-sky-950/30 active:translate-y-0 active:scale-95"
                onclick="changePadding(1)"
              >
                <span class="relative z-10">+1</span>
                <span
                  class="absolute inset-0 z-0 bg-linear-to-b from-white/10 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                ></span>
              </button>
            </div>

            <input id="qr-padding" type="hidden" value="1" />
          </div>

          <!-- FINDER STYLE -->
          <div class="flex flex-col gap-2">
            <label class="text-xl font-bold text-white">
              Position marker style
            </label>

            <div id="finder-buttons" class="flex gap-3">
              <button
                data-style="square"
                class="finder-btn group flex items-center justify-center rounded-2xl border border-white/15 bg-white/6 p-3 shadow-lg shadow-blue-950/20 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-sky-300/50 hover:bg-sky-300/10 hover:shadow-xl hover:shadow-sky-950/30 active:translate-y-0 active:scale-95"
              >
                <div
                  class="h-6 w-6 bg-sky-200 shadow-[0_0_15px_rgba(125,211,252,0.3)] transition-transform duration-300 group-hover:scale-110"
                ></div>
              </button>

              <button
                data-style="rounded"
                class="finder-btn group flex items-center justify-center rounded-2xl border border-white/15 bg-white/6 p-3 shadow-lg shadow-blue-950/20 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-sky-300/50 hover:bg-sky-300/10 hover:shadow-xl hover:shadow-sky-950/30 active:translate-y-0 active:scale-95"
              >
                <div
                  class="h-6 w-6 rounded-lg bg-sky-200 shadow-[0_0_15px_rgba(125,211,252,0.3)] transition-transform duration-300 group-hover:scale-110"
                ></div>
              </button>

              <button
                data-style="circle"
                class="finder-btn group flex items-center justify-center rounded-2xl border border-white/15 bg-white/6 p-3 shadow-lg shadow-blue-950/20 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-sky-300/50 hover:bg-sky-300/10 hover:shadow-xl hover:shadow-sky-950/30 active:translate-y-0 active:scale-95"
              >
                <div
                  class="h-6 w-6 rounded-full bg-sky-200 shadow-[0_0_15px_rgba(125,211,252,0.3)] transition-transform duration-300 group-hover:scale-110"
                ></div>
              </button>
            </div>
          </div>

          <!-- GENERATE -->
          <button
            class="group relative mt-4 w-full overflow-hidden rounded-2xl border border-emerald-300/30 bg-emerald-500/70 px-4 py-3 font-bold text-white shadow-xl shadow-emerald-950/30 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-emerald-200/60 hover:bg-emerald-500/85 hover:shadow-2xl hover:shadow-emerald-500/20 active:translate-y-0 active:scale-[0.99]"
            onclick="generateQR()"
          >
            <span
              class="absolute inset-0 bg-linear-to-b from-white/15 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
            ></span>

            <span class="relative">Generate</span>
          </button>
        </div>

        <!-- QR CODE DISPLAY -->
        <div
          class="flex h-auto w-full flex-col rounded-2xl border border-white/15 bg-blue-950/20 p-4 shadow-2xl shadow-blue-950/30 backdrop-blur-xl"
        >
          <!-- QR CANVAS -->
          <div id="qrWrapper" class="my-auto flex justify-center">
            <canvas
              id="qrCanvas"
              width="400"
              height="400"
              class="min-w-64 w-full max-w-88 drop-shadow-2xl"
            ></canvas>
          </div>

          <!-- EXPORT BUTTONS -->
          <div class="mt-5 flex justify-center gap-4">
            <button
              class="group relative overflow-hidden rounded-2xl border border-sky-200/30 bg-sky-400/60 px-5 py-2.5 font-bold text-white shadow-xl shadow-sky-950/30 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-sky-100/60 hover:bg-sky-400/75 hover:shadow-2xl hover:shadow-sky-400/20 active:translate-y-0 active:scale-[0.98]"
              onclick="exportPNG(2048)"
            >
              <span
                class="absolute inset-0 bg-linear-to-b from-white/15 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
              ></span>
              <span class="relative">Export PNG</span>
            </button>

            <button
              class="group relative overflow-hidden rounded-2xl border border-indigo-200/30 bg-indigo-400/60 px-5 py-2.5 font-bold text-white shadow-xl shadow-indigo-950/30 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-indigo-100/60 hover:bg-indigo-400/75 hover:shadow-2xl hover:shadow-indigo-400/20 active:translate-y-0 active:scale-[0.98]"
              onclick="exportSVG()"
            >
              <span
                class="absolute inset-0 bg-linear-to-b from-white/15 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
              ></span>
              <span class="relative">Export SVG</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- SCRIPTS -->
    <script src="/assets/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="/assets/js/qr.js"></script>
    <link rel="stylesheet" href="/assets/css/qr.css" />

    <!-- FOOTER -->
    <footer class="z-50">
      <div id="footer" class="bg-blue-700/60 md:mb-4 md:mx-3 md:rounded-full">
        <div class="flex justify-center items-center">
          2019-<full-year></full-year>
          <i class="fad fa-copyright w-5 h-4"></i>
          <strong>Adrian Marciniuk</strong>
        </div>

        <a href="/en/privacy-policy/" class="flex justify-center items-center"
          ><i class="fad fa-user-secret w-5 h-4"></i> Privacy Policy</a
        >
      </div>
      <!-- 100% privacy-first analytics -->
      <script
        data-collect-dnt="true"
        async
        src="https://scripts.simpleanalyticscdn.com/latest.js"
      ></script>
      <noscript
        ><img
          src="https://queue.simpleanalyticscdn.com/noscript.gif?collect-dnt=true"
          alt=""
          referrerpolicy="no-referrer-when-downgrade"
      /></noscript>
    </footer>
  </body>
</html>
